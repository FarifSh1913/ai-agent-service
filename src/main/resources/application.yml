server:
  port: 8082

spring:
  application:
    name: ai-agent-service

openai:
  api-key: ${OPENAI_API_KEY:}
  agent-id: ${OPENAI_AGENT_ID:}
  agents:
    nearby-places:
      id: ${OPENAI_NEARBY_PLACES_AGENT_ID:agent_2fc10e837c4b4ef3bab6cb6b0659b6d2f8a8a83acb5f4cdcb6}
  polling:
    interval-ms: ${OPENAI_POLLING_INTERVAL_MS:750}
    timeout-ms: ${OPENAI_POLLING_TIMEOUT_MS:60000}

document-service:
  base-url: ${DOCUMENT_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
