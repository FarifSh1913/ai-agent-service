server:
  port: 8082

spring:
  application:
    name: ai-agent-service

openai:
  api-key: ${OPENAI_API_KEY:}
  agent-id: ${OPENAI_AGENT_ID:}

document-service:
  base-url: ${DOCUMENT_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
